# 5강: Docker Compose 설정
# 로컬 개발 및 Production 배포용 컨테이너 설정
#
# 사용법:
#   # 로컬 개발 (빌드 + 실행)
#   docker-compose up --build
#
#   # Production (GHCR 이미지 사용)
#   LUMI_IMAGE=ghcr.io/owner/repo:tag docker-compose up -d
#
#   # 백그라운드 실행
#   docker-compose up -d
#
#   # 로그 확인
#   docker-compose logs -f
#
#   # 종료
#   docker-compose down
#
# 서비스 구성:
#   - lumi-agent: FastAPI 에이전트 서버 (메인)
#   - (Supabase는 클라우드 서비스 사용)
#   - (Redis는 6강에서 추가 예정)

services:
  # =============================================================
  # 메인 에이전트 서비스
  # =============================================================
  lumi-agent:
    image: ${LUMI_IMAGE:-lumi-agent:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumi-agent

    ports:
      - "8000:8000"

    environment:
      - UPSTAGE_API_KEY=${UPSTAGE_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=false
      # ===== LLMOps 1강: LiteLLM =====
      - USE_LITELLM=${USE_LITELLM:-true}
      # ===== LLMOps 2강: 체크포인터 =====
      - ENABLE_CHECKPOINTER=${ENABLE_CHECKPOINTER:-true}
      - CHECKPOINTER_TYPE=${CHECKPOINTER_TYPE:-postgres}
      # ===== LLMOps 2강: 비용 관리 =====
      - ENABLE_COST_TRACKING=${ENABLE_COST_TRACKING:-true}
      - DAILY_COST_LIMIT=${DAILY_COST_LIMIT:-10.0}
      - MAX_CONTEXT_TOKENS=${MAX_CONTEXT_TOKENS:-3000}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      # ===== LLMOps 3강 : Lanfuse =====
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    restart: unless-stopped
